# .github/workflows/deploy.yml
# RootSignal CI/CD pipeline.
# On every push to main:
#   1. Runs backend tests (linting + import checks)
#   2. Deploys backend to Render via deploy hook
#   3. Deploys frontend to Vercel via Vercel CLI

name: Deploy RootSignal

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check imports resolve
        working-directory: backend
        run: node --input-type=module <<'EOF'
          import('./src/db/client.js').catch(() => {});
          import('./src/routes/sentry.middleware.js').catch(() => {});
          import('./src/routes/sentry.validator.js').catch(() => {});
          import('./src/services/correlator.service.js').catch(() => {});
          console.log('Import check passed');
          process.exit(0);
          EOF

  # ── Job 2: Deploy Backend to Render ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n"

  # ── Job 3: Deploy Frontend to Vercel ────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: frontend
        run: |
          vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes